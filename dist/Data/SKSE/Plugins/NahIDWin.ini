; NahIDWin.ini - Poise + Posture + Stamina for Skyrim LE (SKSE plugin).
; Changes are picked up while the game runs (file is reloaded when saved).
; Values shipped here = the "Normal" preset of the in-game menu (SkyUI MCM).
; Menu presets (Easy / Normal / Hard, or Manual) overwrite the keys they manage when the menu is closed.
; 1 = on, 0 = off unless noted. Times are seconds (s) or milliseconds (Ms).

[General]
Enabled=1
; Poise/posture on the player and on NPCs
Player=1
NPCs=1

[Inpa]
; 1 = parry, block and difficulty come from the Inpa Sekiro Combat records inside NahIDWin.esp
Mode=1
; Player can block arrows / spells and resists poison while blocking
BlockArrow=1
BlockMagic=1
ResistPoison=1
LogPlayerDamage=1

[Menu]
; 0 = English, 1 = Portuguese (BR)
Language=0

; ---------------------------------------------------------------- POISE
[Poise]
; Max poise = (actor mass x MassMult + armor rating x ArmorFraction, at least MinPoise) x scale
MaxScalePlayer=5.0
MaxScaleNPC=6.5
MassMult=20.0
ArmorFraction=0.5
MinPoise=10.0
ArmorActorValue=39
; Poise damage taken (multiplier)
NPCTakenMult=3.1
PlayerTakenMult=1.35
; Seconds to regenerate fully, and delay before regeneration starts
RegenSeconds=9.0
RegenDelaySeconds=3.0
; Player: no hit staggers while poise is above this fraction (below it the vanilla stagger / SBS take over)
PlayerStaggerFloor=0.5
; Max poise bonus per character level; poise damage bonus per attacker level
LevelBonus=1.5

[Damage]
; Poise damage of a hit = weapon weight x WeightMult + weapon type base + attacker mass x AttackerMassMult,
; then x (1 + weapon stagger x WeaponStaggerMult) and the multipliers below.
WeightMult=0.5
AttackerMassMult=1.0
; Type base: 0 fists, 1 1H sword, 2 dagger, 3 1H axe, 4 1H mace, 5 2H sword, 6 2H axe/hammer, 7 bow, 8 staff, 9 crossbow
TypeBase0=3.0
TypeBase1=5.0
TypeBase2=3.0
TypeBase3=6.0
TypeBase4=7.0
TypeBase5=10.0
TypeBase6=12.0
TypeBase7=4.0
TypeBase8=3.0
TypeBase9=7.0
; Fists and creatures: race unarmed damage x UnarmedMult (creatures also add CreatureBase)
UnarmedMult=1.0
CreatureBase=6.0
MagicDamage=4.0
WeaponStaggerMult=1.0
PowerAttackMult=2.0
BashMult=1.5
SneakMult=1.0
RangedMult=0.8
; Poise paid by the defender for a blocked hit (x damage). Blocking never staggers.
BlockedMult=0.12
; Same for a blocked hit on an NPC (NPCs keep their armor class while blocking; only a parry counts as class 4)
BlockedMultNpc=0.65
; Poise damage bonus per attacker level
AttackerLevelMult=0.35

[Classes]
; Attack/defense class 1-4: 1 clothes + light weapons, 2 light armor + medium weapons, 3 heavy,
; 4 power attacks, bashes, giants.
; Poise damage multiplier = DiffBase ^ (attacker class - defense class).
DiffBase=1.5
; Posture never drops below this fraction because of a class difference
PostureFloor=0.5
SeverePostureMult=2.0
; NPC defense class by armor rating: below ArmorMid = 1, below ArmorHeavy = 2, above = 3
ArmorMid=40
ArmorHeavy=100
; Player defense class by total weight of worn body, head, hands and feet pieces
WornWeightMid=8
WornWeightHeavy=28
; Max poise +35% per armor class above 1
PoiseStepPerArmorClass=0.35
; Weapon class by weight: up to Light = 1, up to Medium = 2, above = 3
LightWeaponMaxWeight=8
MediumWeaponMaxWeight=16
; Creature class by mass
CreatureMediumMass=0.9
CreatureHeavyMass=1.5
MagicClass=2

[Tiers]
; Poise tiers by fraction left before the hit: above MidFraction stable (normal hits one class up are absorbed),
; MidFraction to LowFraction light stagger, below LowFraction medium stagger.
MidFraction=0.5
LowFraction=0.25
; Tier effect on posture damage
PostureMultHigh=0.25
PostureMultMid=0.6
PostureMultLow=1.0

[StaggerLock]
; Poise at 0: the victim is locked in stagger. Posture damage is multiplied meanwhile; poise refills at the end.
SecondsNpc=3.5
SecondsPlayer=1.75
PostureMult=3.5
; The native stagger is repeated every RepeatMs; a failed attempt is retried after RetryMs, up to MaxRetries times
RepeatMs=700
RetryMs=150
MaxRetries=3

; ---------------------------------------------------------------- POSTURE
[Posture]
Enabled=1
; Overall posture difficulty (higher = posture breaks faster)
Difficulty=1.0
Base=100.0
HealthFraction=0.3
ArmorFraction=0.3
ScalePlayer=5.5
ScaleNPC=4.0
DamageMult=1.0
; Posture paid by the defender for a blocked hit
BlockedMult=0.105
BlockedMultNpc=0.70
LowHealthBonus=1.0
RegenSeconds=60.0
RegenDelaySeconds=3.0
ResetFraction=0.0
; Posture break: BleedOut (kneeling) duration and immunity afterwards
BleedOutSeconds=4.5
BleedOutImmuneSeconds=4.5

; ---------------------------------------------------------------- STAGGER
[Stagger]
; 1 = the player's vanilla hit reactions are suppressed while poise is above PlayerStaggerFloor. NPCs are always vanilla.
SuppressVanilla=1
; 1 = plugin plays the stagger animation itself (recommended), 0 = through the Papyrus bridge
StaggerMode=1
NativeSlot=1
NativeEvent=staggerStart
ResetFraction=1.0
; 1 = old forced light/medium stagger and repeated staggerlock (conflicts with SBS; leave 0)
LegacyForcedStagger=0
; Light stagger (only used with LegacyForcedStagger=1): on/off, on player, on NPCs, minimum spacing for NPCs / player
LightEnabled=1
LightPlayer=1
LightNPCs=1
LightCooldownMs=600
LightCooldownPlayerMs=1800
; Power attacks cause at least a medium stagger
MediumOnPowerAttack=1
; Seconds the player cannot be staggered again
PlayerImmuneAfterSeconds=1.75

[Knockback]
Enabled=1
Force=0.9
Player=1
OnPowerAttack=1
OnGiantCreature=1
GiantMassMin=3.0
VictimMassMax=3.0
OnHeavyWeapon=0
HeavyWeaponMinWeight=15.0

[NpcBlock]
; v0.27: NPC AI and animations are vanilla. NPC guards break through stamina, poise and posture only.

[Block]
; Normal block (no parry) drains the attacker's stamina
DrainEnabled=1
AttackerStamina=12.0
PowerAttackMult=1.5

; ---------------------------------------------------------------- STAMINA
[Stamina]
Enabled=1
; Cost of a swing = (SwingBase + weapon weight x SwingPerWeight) x weapon type multiplier
WeightCost=1
SwingBase=5.0
SwingPerWeight=0.75
; Power attack and shield bash multipliers (bash uses shield weight)
PowerMult=2.0
BashWeightMult=1.35
; Zero the game's own stamina costs for attacks, bashes and blocks (the mod charges them)
ZeroVanillaCosts=1
; NPCs pay the swing cost too (range in game units)
NpcSwingCharge=1
NpcSwingRange=3000
; Type multiplier: 0 fists, 1 1H sword, 2 dagger, 3 1H axe, 4 1H mace, 5 2H sword, 6 2H axe/hammer, 7 bow, 8 staff, 9 spell, 10 shield
TypeMult0=0.6
TypeMult1=1.0
TypeMult2=0.6
TypeMult3=1.2
TypeMult4=1.3
TypeMult5=1.6
TypeMult6=1.8
TypeMult7=0.8
TypeMult8=0.6
TypeMult9=0.0
TypeMult10=1.0
; Blocking: stamina cost = damage x BlockCostFactor x 1.5^(attack class - armor class); shield x BlockCostShieldMult
BlockCostFactor=0.28
BlockCostShieldMult=0.6
; Guard break (stamina runs out while blocking): poise to 0, stagger lock, posture +this percent
GuardBreakPosturePercent=20
; Low stamina zone: below LowZoneFraction regen is multiplied and poise damage taken is multiplied
LowZoneFraction=0.25
LowZoneRegenMult=0.7
LowZonePoiseDamageMult=1.2
; Stamina regen while poise is below 50% / below 25%
PoiseMidRegenMult=0.8
PoiseLowRegenMult=0.6
; Armor class (1-3) slows regen by ClassRegenPenalty per class above 1
ClassRegen=1
ClassRegenPenalty=0.08
; Combat regen: percent of normal, pause after attacking, factor while blocking
CombatRegenEnabled=1
CombatRegenPercent=150
CombatRegenDelayMs=600
CombatRegenBlockFactor=0.4
HitCostNPC=0.0

[NpcStamina]
; NPC stamina costs are a percent of the NPC's own max stamina, so a huge stamina pool does not make them tireless.
; Swing: percent of max for a reference swing (weapon weight 10, multiplier 1); heavier weapons and power attacks cost more.
SwingPercent=6.0
; Blocking: percent of max per blocked hit at equal class; x1.5 per class the attack is above the armor. Stamina at 0 = guard break.
BlockPercent=22
; 0 = use the absolute costs of [Stamina] instead

[Exhaustion]
Enabled=1
; Stamina hits 0 by swinging: no regen for at least Seconds; it ends when stamina reaches TargetPercent
; or after MaxSeconds. Regen is multiplied by RegenFactor meanwhile.
Seconds=2.0
MaxSeconds=7.0
TargetPercent=35
RegenFactor=0.7
; Movement speed factor while exhausted (0.5 = half), poise/posture damage multiplier, stamina given at the end
SpeedFactor=0.5
PoiseDamageMult=1.5
RecoverStamina=50
CooldownSeconds=8.0
; NPCs: exhaustion on/off, stamina floor (0 = none), stamina % given at the end, seconds staggered
NPCs=1
NpcStaminaFloorPercent=25
NpcRecoverPercent=50
NpcSeconds=5.0
; One-shot repair: set to 1 if movement speed stayed reduced. On the next game load the player's speed is
; reset to its base value and this key returns to 0.
RepairSpeedOnLoad=0

; ---------------------------------------------------------------- PARRY AND MAGIC
[Parry]
Enabled=1
WindowMs=300
CooldownMs=200
RequireHeld=1
FrontAngleDegrees=100
NoDamage=1
SwallowGameReaction=1
Effects=1
; Attacker: posture taken (fraction of max), stagger, stamina drained
AttackerPostureFraction=0.10
AttackerStagger=1
AttackerStaminaDrain=20.0
; Defender recovers this fraction of max posture / poise / stamina on a parry.
; Stamina is given by the Inpa parry script (the mod sets its global from this key).
DefenderPostureRecoverFraction=0.15
DefenderPoiseRecoverFraction=0.25
DefenderStaminaRecoverFraction=0.30
; After a player parry stamina is capped at (value before + refund + 3%) for this long; 0 = off. Logs before/peak/after.
StaminaCapMs=1500

[Magic]
; Continuous spells: poise/posture fraction, interval
DotIntervalMs=1000
DotPoiseMult=0.5
; Deflect: after parrying a spell, holding block returns it to the caster
DeflectEnabled=1
DeflectRequireParry=0
DeflectRecast=0
; Magicka paid per point of damage deflected (weapon / shield)
DeflectCostWeapon=0.55
DeflectCostShield=0.35
; Fraction of deflected damage returned to the attacker's health, poise and posture (weapon / shield)
DeflectReturnWeapon=0.8
DeflectReturnShield=1.0
DeflectPoiseFactor=1.0
DeflectPostureFactor=1.0
DeflectWindowMs=2500

; ---------------------------------------------------------------- SPECIAL
[Rage]
Enabled=1
; DirectInput key code (34 = G)
Key=34
DurationSeconds=5.5
CooldownSeconds=25.0
; Cost: 0 = health, 1 = stamina; LifeCostPercent of max health (never kills)
CostType=0
CostPercent=15.0
LifeCostPercent=18.0
; Player: extra damage reduction and damage bonus (%)
ExtraReduction=40.0
DamageBonus=20.0
; NPC: extra damage reduction and damage bonus (%)
NPCExtraReduction=25.0
NPCDamageBonus=8.0
StaggerImmune=1
ZeroStamina=1
; NPCs use rage: posture above / poise below / chance % / cooldown / cost %
NPCs=1
NPCPostureTrigger=0.8
NPCPoiseTrigger=0.15
NPCChancePercent=45
NPCCooldownSeconds=52.0
NPCCostPercent=0.0
; Visual effect: 0 none, 1-3 styles
NPCVisual=1
PlayerVisual=1

[Supreme]
Enabled=1
; DirectInput key code (35 = H)
Key=35
ActivationAnim=shoutStart
DurationSeconds=6.0
CooldownSeconds=425.0
; Cost: percent of max health per second (never kills)
CostPercentPerSecond=2.0
; Fire aura: radius and damage per second
Radius=300
DamagePerSecond=8.0

[Bosses]
; Unique NPCs this many levels above the player (or more) are bosses: 2 lives
Enabled=1
LevelMargin=7
PoiseMult=1.35
PostureMult=1.35
HealthPercent=100
InvulnSeconds=3

[BigCreatures]
; Giants and dragons
PoiseMult=1.35
PostureMult=1.35
RageDurationMult=1.5

[Perilous]
; Boss/giant attacks that ignore blocking: dodge or parry. A parry gives ParryPosture to the attacker.
Enabled=1
ChancePercent=20
WindowMs=1300
CooldownSeconds=12
DamageMult=1.5
ParryPosture=0.55
Range=700

[Execution]
; Method: 0 = Inpa execution, ours only if it does not start; 1 = ours immediately; 2 = direct kill without animation
Method=0
Enabled=1
KillBigCreatures=1

[Lives]
; Extra lives unlocked at Level2 / Level3
Enabled=1
EssentialBleedout=1
Level2=30
Level3=60
HealthPercent=50
GoldLossPercent=25
InvulnSeconds=3.0

[Health]
Enabled=1
TakenMult=1.0
DealtMult=1.0
BleedOutDamageMult=1.0

; ---------------------------------------------------------------- HUD
[HUD]
Enabled=1
Player=1
PlayerAlways=0
Target=1
RageIcon=1
IconsAlways=1
; BarStyle: 0 flat, 1 Sekiro
BarStyle=1
ScreenWidth=1280
ScreenHeight=720
; Position: H 0 left, 1 center, 2 right; V 0 top, 1 center, 2 bottom
PlayerPosH=0
PlayerPosV=2
PlayerShiftX=120
PlayerShiftY=-117
PlayerWidth=200
BarHeight=5
TargetPosH=1
TargetPosV=0
TargetShiftX=0
TargetShiftY=55
; 0 = 200
TargetWidth=0
TargetBarHeight=5
; 1 = follow the game's health bar
TargetAnchor=0
TargetOffsetX=0
TargetOffsetY=22
TargetRadius=150
TargetMaxDistance=2000
TargetStickyMs=3000

[TrueHUD]
Enabled=1
ShowForPlayer=1
FlashOnBreak=1
; Bar: 0 poise, 1 posture, 2 whichever is closest to breaking
Bar=0
PoiseWarnFraction=0.3
SecondBar=0
BarPoise=1
BarRage=1
SecondBarX=490
SecondBarY=640
SecondBarWidth=300
SecondBarHeight=6
EnemyBars=0
EnemyBarWidth=110
EnemyBarHeight=4
EnemyBarOffsetY=14
EnemyBarMax=8

; ---------------------------------------------------------------- DIAGNOSTICS
[Diagnostics]
Enabled=1
IgnoreOwnSpells=1
LogHitsMax=400
SummarySeconds=30
DumpVtable=0
LogPlayerEvents=1
